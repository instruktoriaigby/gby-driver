<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>GBY Driver</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS / Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GBY Driver">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- App custom mobile fixes -->
  <link rel="stylesheet" href="styles.css">

  <style>
    .nav-btn {
      cursor: pointer;
      user-select: none;
    }

    @media (max-width: 767px) {
      #sidebar {
        width: 100% !important;
        height: auto !important;
        max-height: 88px;
        padding: 8px 10px 10px 10px !important;
        border-right: 0 !important;
        border-top: 1px solid rgba(51, 65, 85, 0.9);
        background: rgba(2, 6, 23, 0.96);
        backdrop-filter: blur(12px);
      }

      .mobile-nav-wrap {
        position: relative;
        width: 100%;
      }

      #sidebar .mobile-nav-scroll {
        display: flex !important;
        flex-direction: row !important;
        gap: 8px;
        overflow-x: auto;
        overflow-y: hidden;
        width: 100%;
        padding: 0 22px 8px 22px;
        scroll-snap-type: x proximity;
        scrollbar-width: none;
        -webkit-overflow-scrolling: touch;
      }

      #sidebar .mobile-nav-scroll::-webkit-scrollbar {
        display: none;
      }

      #sidebar .nav-btn {
        flex: 0 0 auto;
        min-width: 92px;
        max-width: 124px;
        height: 48px;
        padding: 6px 10px !important;
        border-radius: 14px;
        font-size: 11px;
        line-height: 1.15;
        text-align: center;
        white-space: normal;
        display: flex;
        align-items: center;
        justify-content: center;
        scroll-snap-align: start;
        background: rgba(30, 41, 59, 0.9);
        border: 1px solid rgba(71, 85, 105, 0.8);
      }

      #sidebar .nav-btn .label {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      #sidebar .nav-btn.active {
        background: #2563eb !important;
        border-color: #60a5fa;
        color: #ffffff;
        box-shadow: 0 0 0 1px rgba(96, 165, 250, 0.35);
      }

      .mobile-nav-fade {
        position: absolute;
        top: 0;
        bottom: 12px;
        width: 30px;
        z-index: 2;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      .mobile-nav-fade-left {
        left: 0;
        background: linear-gradient(to right, rgba(2, 6, 23, 1), rgba(2, 6, 23, 0));
      }

      .mobile-nav-fade-right {
        right: 0;
        background: linear-gradient(to left, rgba(2, 6, 23, 1), rgba(2, 6, 23, 0));
      }

      .mobile-nav-wrap.can-scroll-left .mobile-nav-fade-left {
        opacity: 1;
      }

      .mobile-nav-wrap.can-scroll-right .mobile-nav-fade-right {
        opacity: 1;
      }

      .mobile-scroll-progress {
        height: 3px;
        width: 82px;
        margin: 0 auto;
        border-radius: 999px;
        background: rgba(71, 85, 105, 0.75);
        overflow: hidden;
      }

      .mobile-scroll-progress-fill {
        height: 100%;
        width: 20%;
        border-radius: 999px;
        background: #60a5fa;
        transform: translateX(0%);
        transition: transform 0.15s ease, width 0.15s ease;
      }

      #content {
        padding-bottom: 108px !important;
      }
    }

    @media (min-width: 768px) {
      .mobile-nav-wrap {
        position: static;
      }

      .mobile-nav-fade,
      .mobile-scroll-progress {
        display: none !important;
      }
    }
  </style>
</head>

<body class="bg-slate-900 text-white min-h-screen md:flex">

  <!-- TOP BAR -->
  <div
    id="topBar"
    class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between gap-3 bg-slate-950/95 backdrop-blur border-b border-slate-800 px-3 py-2 md:left-auto md:top-4 md:right-4 md:bg-transparent md:border-0 md:p-0"
  >
    <div class="flex items-center gap-2 md:hidden">
      <img src="Logo_GBY.jpg" class="h-7 object-contain" alt="GBY">
      <span class="text-sm font-semibold">GBY Driver</span>
    </div>

    <div class="flex items-center gap-2 ml-auto">
      <button
        id="logoutBtn"
        type="button"
        class="hidden bg-slate-800 text-white px-3 py-2 rounded-xl border border-slate-600 text-sm"
        data-i18n="common.logout"
      >
        Atsijungti
      </button>

      <select
        id="langSwitcher"
        class="bg-slate-800 text-white px-3 py-2 rounded-xl border border-slate-600 text-sm"
      >
        <option value="lt">LT</option>
        <option value="en">EN</option>
        <option value="ru">RU</option>
      </select>
    </div>
  </div>

  <!-- SIDEBAR / MOBILE BOTTOM NAV -->
  <div
    id="sidebar"
    class="fixed bottom-0 left-0 right-0 z-40 bg-slate-950 border-t border-slate-800 p-2 md:static md:w-64 md:min-h-screen md:p-4 md:border-t-0 md:flex md:flex-col md:justify-between md:shrink-0 transition-all duration-300"
  >

    <div>
      <div class="hidden md:flex items-center justify-between px-3 mb-4">
        <img src="Logo_GBY.jpg" id="logoText" class="h-8 object-contain" alt="GBY">
        <button id="toggleSidebar" type="button" class="bg-slate-800 px-2 py-1 rounded text-sm">☰</button>
      </div>

      <div class="mobile-nav-wrap">
        <div class="mobile-nav-fade mobile-nav-fade-left"></div>
        <div class="mobile-nav-fade mobile-nav-fade-right"></div>

        <div class="mobile-nav-scroll md:block md:space-y-2">

        <button
          type="button"
          data-page="dashboard"
          class="nav-btn w-full text-left px-4 py-3 rounded-xl bg-blue-600 hover:bg-blue-700"
        >
          <span class="label" data-i18n="nav.dashboard">Pagrindinis</span>
        </button>

        <button
          type="button"
          data-page="defektas"
          class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"
        >
          <span class="label" data-i18n="nav.defects">Defektai</span>
        </button>

        <button
          type="button"
          data-page="vilkiko-priemimas"
          data-roles="admin,instructor,master_driver"
          class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"
        >
          <span class="label" data-i18n="nav.truck_acceptance">Vilkiko priėmimas</span>
        </button>

        <button
          type="button"
          data-page="master-driver"
          data-roles="admin,instructor,master_driver,driver"
          class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"
        >
          <span class="label" data-i18n="nav.loading_schemes">Krovimo schemos</span>
        </button>

        <button
          type="button"
          data-page="instrukcijos"
          class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"
        >
          <span class="label" data-i18n="nav.instructions">Instrukcijos</span>
        </button>

        <button
          type="button"
          data-page="uzduotys"
          class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"
        >
          <span class="label" data-i18n="nav.tasks">Užduotys</span>
        </button>

        <button
          type="button"
          id="settingsNavBtn"
          data-page="nustatymai"
          data-roles="admin,instructor,master_driver"
          class="nav-btn w-full text-left px-4 py-3 rounded-xl hover:bg-slate-800"
        >
          <span class="label" data-i18n="nav.settings">Nustatymai</span>
        </button>

        </div>

        <div class="mobile-scroll-progress">
          <div id="mobileNavProgress" class="mobile-scroll-progress-fill"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div
    id="content"
    class="flex-1 w-full pt-16 pb-24 px-3 transition-all duration-300 md:p-8 md:pb-8"
  >
    <div class="text-slate-400" data-i18n="common.loading">Kraunama...</div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
