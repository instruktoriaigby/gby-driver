<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>GBY Driver</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">

  <meta name="theme-color" content="#020617">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS / Safari PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GBY Driver">

  <!-- Icons -->
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png">
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <!-- App custom mobile fixes -->
  <link rel="stylesheet" href="styles.css">
</head>

<body class="bg-slate-900 text-white min-h-screen md:flex">

  <!-- TOP BAR -->
  <div
    id="topBar"
    class="fixed top-0 left-0 right-0 z-50 flex items-center justify-between gap-3 bg-slate-950/95 backdrop-blur border-b border-slate-800 px-3 py-2 md:left-auto md:top-4 md:right-4 md:bg-transparent md:border-0 md:p-0"
  >
    <div class="flex items-center gap-2 md:hidden">
      <img src="Logo_GBY.jpg" class="h-7 object-contain" alt="GBY">
      <span class="text-sm font-semibold">GBY Driver</span>
    </div>

    <div class="flex items-center gap-2 ml-auto">
      <button
        id="logoutBtn"
        class="hidden bg-slate-800 text-white px-3 py-2 rounded-xl border border-slate-600 text-sm"
        data-i18n="common.logout"
      >
      Atsijungti
    </button>

      <select
        id="langSwitcher"
        class="bg-slate-800 text-white px-3 py-2 rounded-xl border border-slate-600 text-sm"
      >
        <option value="lt">LT</option>
        <option value="en">EN</option>
        <option value="ru">RU</option>
      </select>
    </div>
  </div>

  <!-- SIDEBAR / MOBILE BOTTOM NAV -->
  <div
    id="sidebar"
    class="fixed bottom-0 left-0 right-0 z-40 bg-slate-950 border-t border-slate-800 p-2 md:static md:w-64 md:min-h-screen md:p-4 md:border-t-0 md:flex md:flex-col md:justify-between md:shrink-0 transition-all duration-300"
  >

    <div>
      <div class="hidden md:flex items-center justify-between px-3 mb-4">
        <img src="Logo_GBY.jpg" id="logoText" class="h-8 object-contain" alt="GBY">
        <button id="toggleSidebar" class="bg-slate-800 px-2 py-1 rounded text-sm">☰</button>
      </div>

      <div class="grid grid-cols-5 gap-1 md:block md:space-y-2">
        <button data-page="dashboard" class="nav-btn w-full text-left px-4 py-2 rounded bg-blue-600">
          <span class="label" data-i18n="nav.dashboard">Pagrindinis</span>
        </button>

        <button data-page="defektas" class="nav-btn w-full text-left px-4 py-2 rounded hover:bg-slate-800">
          <span class="label" data-i18n="nav.defects">Defektai</span>
        </button>

        <button data-page="instrukcijos" class="nav-btn w-full text-left px-4 py-2 rounded hover:bg-slate-800">
          <span class="label" data-i18n="nav.instructions">Instrukcijos</span>
        </button>

        <button data-page="uzduotys" class="nav-btn w-full text-left px-4 py-2 rounded hover:bg-slate-800">
          <span class="label" data-i18n="nav.tasks">Užduotys</span>
        </button>

        <button
          id="settingsNavBtn"
          data-page="nustatymai"
          class="nav-btn w-full text-left px-4 py-2 rounded hover:bg-slate-800"
        >
          <span class="label" data-i18n="nav.settings">Nustatymai</span>
        </button>
      </div>
    </div>
  </div>

  <!-- CONTENT -->
  <div
    id="content"
    class="flex-1 w-full pt-16 pb-24 px-3 transition-all duration-300 md:p-8 md:pb-8"
  >
    <div class="text-slate-400" data-i18n="common.loading">Kraunama...</div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
