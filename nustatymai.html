<div class="w-full max-w-7xl mx-auto px-4 text-white">

  <h1
    class="text-xl sm:text-2xl font-semibold mb-2"
    data-i18n="settings.title"
  >
    Valdymo panelė
  </h1>

  <p
    class="text-slate-400 mb-6 text-sm sm:text-base"
    data-i18n="settings.subtitle"
  >
    Instrukcijos ir pagrindinio puslapio valdymas
  </p>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

    <div class="bg-slate-900 rounded-xl p-4 border border-slate-700">
      <h2
        class="text-lg mb-4 font-semibold"
        data-i18n="settings.instructions_list"
      >
        Instrukcijų sąrašas
      </h2>

      <input
        id="instrSearch"
        type="search"
        list="instrSearchList"
        autocomplete="off"
        class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Ieškoti instrukcijos..."
      >

      <datalist id="instrSearchList"></datalist>

      <div id="instrList" class="space-y-2"></div>
    </div>

    <div
      id="instructionFormPanel"
      class="bg-slate-900 rounded-xl p-4 border border-slate-700 space-y-4"
    >
      <h2
        class="text-lg font-semibold"
        data-i18n="settings.new_instruction"
      >
        Nauja instrukcija
      </h2>

      <select
        id="typeSelect"
        class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700"
      >
        <option value="general" data-i18n="tabs.general">General</option>
        <option value="news" data-i18n="tabs.news">Naujovės</option>
        <option value="event" data-i18n="tabs.events">Eismo įvykiai</option>
        <option value="cargo" data-i18n="tabs.cargo">Krovinys</option>
        <option value="eco" data-i18n="tabs.eco">Eko vairavimas</option>
      </select>

      <select
        id="instrLang"
        class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700"
      >
        <option value="lt">LT</option>
        <option value="en">EN</option>
        <option value="ru">RU</option>
      </select>

      <input
        id="title"
        type="text"
        autocomplete="off"
        class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        data-i18n-placeholder="settings.name_placeholder"
        placeholder="Pavadinimas"
      >

      <textarea
        id="desc"
        rows="4"
        class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        data-i18n-placeholder="settings.description_placeholder"
        placeholder="Aprašymas"
      ></textarea>

      <div class="space-y-2">
        <input
          id="video"
          type="url"
          inputmode="url"
          autocomplete="off"
          class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Video nuoroda: Vimeo / YouTube / Google Drive"
        >

        <input
          id="test"
          type="url"
          inputmode="url"
          autocomplete="off"
          class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          data-i18n-placeholder="settings.test_link"
          placeholder="Testo nuoroda"
        >

        <input
          id="pdf"
          type="url"
          inputmode="url"
          autocomplete="off"
          class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          data-i18n-placeholder="settings.pdf_link"
          placeholder="PDF nuoroda"
        >
      </div>

      <div class="form-block hidden" data-type="news">
        <input
          id="newsLink"
          type="url"
          inputmode="url"
          autocomplete="off"
          class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          data-i18n-placeholder="settings.link_placeholder"
          placeholder="Nuoroda"
        >
      </div>

      <div class="form-block hidden space-y-2" data-type="event">
        <textarea
          id="avoid"
          rows="4"
          class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          data-i18n-placeholder="settings.avoid_placeholder"
          placeholder="Kaip išvengti"
        ></textarea>

        <input
          id="eventImages"
          type="file"
          accept="image/*"
          multiple
          class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white"
        >
      </div>

      <div class="form-block hidden space-y-2" data-type="cargo">
        <input
          id="load"
          type="text"
          autocomplete="off"
          class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          data-i18n-placeholder="settings.load_placeholder"
          placeholder="Pakrovimas"
        >

        <input
          id="unload"
          type="text"
          autocomplete="off"
          class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          data-i18n-placeholder="settings.unload_placeholder"
          placeholder="Iškrovimas"
        >

        <textarea
          id="cargoAvoid"
          rows="4"
          class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          data-i18n-placeholder="settings.avoid_placeholder"
          placeholder="Kaip išvengti"
        ></textarea>

        <input
          id="cargoImages"
          type="file"
          accept="image/*"
          multiple
          class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white"
        >
      </div>

      <button
        id="saveBtn"
        type="button"
        class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-semibold disabled:opacity-60 disabled:cursor-not-allowed"
        data-i18n="settings.save_instruction"
      >
        Išsaugoti instrukciją
      </button>
    </div>

  </div>

  <div
    id="dashboardPanel"
    class="mt-10 bg-slate-900 rounded-xl p-4 border border-slate-700"
  >
    <h2
      class="text-lg mb-4 font-semibold"
      data-i18n="settings.dashboard_title"
    >
      Pagrindinio puslapio informacija (JPEG)
    </h2>

    <p
      class="text-slate-400 text-sm mb-4"
      data-i18n="settings.dashboard_subtitle"
    >
      Įkelk iki 3 paveikslėlių (pvz: rezultatai, info, reklama)
    </p>

    <input
      id="dashboardUpload"
      type="file"
      accept="image/jpeg,image/jpg"
      multiple
      class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-white mb-4"
    >

    <button
      id="saveDashboardImages"
      type="button"
      class="bg-green-600 hover:bg-green-700 px-4 py-3 rounded-xl w-full font-semibold disabled:opacity-60 disabled:cursor-not-allowed"
      data-i18n="settings.save_dashboard"
    >
      Išsaugoti dashboard
    </button>

    <div
      id="dashboardPreview"
      class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-6"
    ></div>
  </div>

</div>
