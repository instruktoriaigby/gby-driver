<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>GBY Defect Report</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles.css" />

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-slate-950 text-white">
  <main class="min-h-screen flex items-center justify-center p-4">
    <div class="w-full max-w-2xl bg-slate-900 border border-slate-700 rounded-2xl shadow-xl p-6">
      <div class="flex items-center gap-3 mb-6">
        <img src="assets/logo.png" alt="GBY" class="w-12 h-12 object-contain" onerror="this.style.display='none'" />

        <div>
          <h1 class="text-2xl font-bold">GBY Defect Report</h1>
          <p class="text-sm text-slate-400">Generate PDF defect report</p>
        </div>
      </div>

      <div id="statusBox" class="mb-4 hidden rounded-xl p-4 text-sm"></div>

      <div class="space-y-4">
        <div>
          <label for="description" class="block mb-2 text-sm font-semibold">
            Description
          </label>

          <textarea
            id="description"
            rows="8"
            class="w-full rounded-xl bg-slate-800 border border-slate-700 p-3 text-white placeholder:text-slate-500 focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder="Enter description for the PDF report..."
          ></textarea>
        </div>

        <button
          id="generateBtn"
          type="button"
          class="w-full rounded-xl bg-blue-600 hover:bg-blue-700 disabled:bg-slate-600 disabled:cursor-not-allowed px-4 py-3 font-bold transition"
        >
          Generate PDF report
        </button>
      </div>

      <p class="mt-6 text-xs text-slate-500">
        This page works only with a valid secure report token.
      </p>
    </div>
  </main>

  <script type="module" src="pages/js/defect-report.js"></script>
</body>
</html>
