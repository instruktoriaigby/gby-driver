<div class="w-full max-w-7xl mx-auto px-4 text-white">

  <h1
    class="text-xl sm:text-2xl font-semibold mb-2"
    data-i18n="tasks.title"
  >
    Užduotys
  </h1>

  <p
    class="text-slate-400 mb-6 text-sm sm:text-base"
    data-i18n="tasks.subtitle"
  >
    Valdyk užduotis
  </p>

  <div
    id="taskStats"
    class="hidden grid grid-cols-1 sm:grid-cols-2 gap-4 mb-6"
  >
    <div class="bg-slate-900 rounded-xl border border-slate-700 p-4">
      <div class="text-slate-400 text-sm">Laukia testų</div>
      <div id="pendingTestsCount" class="text-2xl font-semibold mt-1">0</div>
    </div>

    <div class="bg-slate-900 rounded-xl border border-slate-700 p-4">
      <div class="text-slate-400 text-sm">Laukia patvirtinimų</div>
      <div id="pendingConfirmsCount" class="text-2xl font-semibold mt-1">0</div>
    </div>
  </div>

  <div
    id="taskCreateBlock"
    class="bg-slate-900 p-4 rounded-xl border border-slate-700 mb-6"
  >
    <div class="grid grid-cols-1 md:grid-cols-5 gap-4">

      <input
        id="taskTitle"
        type="text"
        autocomplete="off"
        class="p-3 bg-slate-800 rounded-xl w-full border border-slate-700 focus:outline-none focus:ring-2 focus:ring-purple-500"
        data-i18n-placeholder="tasks.task_title_placeholder"
        placeholder="Užduoties pavadinimas"
      >

      <select
        id="taskUser"
        class="p-3 bg-slate-800 rounded-xl w-full border border-slate-700"
      >
        <option value="all" data-i18n="common.all_users">Visiems</option>
      </select>

      <select
        id="taskStatus"
        class="p-3 bg-slate-800 rounded-xl w-full border border-slate-700"
      >
        <option value="pending" data-i18n="tasks.waiting">Laukiama</option>
        <option value="done" data-i18n="tasks.done">Įvykdyta</option>
      </select>

      <select
        id="taskInstrLang"
        class="p-3 bg-slate-800 rounded-xl w-full border border-slate-700"
      >
        <option value="lt">LT</option>
        <option value="en">EN</option>
        <option value="ru">RU</option>
      </select>

      <select
        id="taskInstr"
        class="p-3 bg-slate-800 rounded-xl w-full border border-slate-700"
      >
        <option value="" data-i18n="common.select_instruction">Pasirink instrukciją</option>
      </select>

    </div>

    <textarea
      id="taskDesc"
      rows="3"
      class="w-full mt-3 p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-purple-500"
      data-i18n-placeholder="tasks.description_placeholder"
      placeholder="Aprašymas"
    ></textarea>

    <button
      id="addTask"
      type="button"
      class="mt-4 w-full bg-purple-600 hover:bg-purple-700 p-3 rounded-xl font-semibold disabled:opacity-60 disabled:cursor-not-allowed"
      data-i18n="tasks.add_task"
    >
      Pridėti užduotį
    </button>
  </div>

  <div class="bg-slate-900 p-4 rounded-xl border border-slate-700 mb-4">
    <div class="grid grid-cols-1 md:grid-cols-4 gap-3">

      <input
        id="filterSearch"
        type="search"
        autocomplete="off"
        class="p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
        data-i18n-placeholder="tasks.search_placeholder"
        placeholder="Ieškoti užduoties..."
      >

      <select
        id="filterStatus"
        class="p-3 bg-slate-800 rounded-xl border border-slate-700"
      >
        <option value="all" data-i18n="tasks.all_statuses">Visi statusai</option>
        <option value="pending" data-i18n="tasks.waiting">Laukiama</option>
        <option value="done" data-i18n="tasks.done">Įvykdyta</option>
      </select>

      <div id="filterUserWrap">
        <input
          id="filterUserSearch"
          type="search"
          list="filterUserList"
          autocomplete="off"
          class="p-3 bg-slate-800 rounded-xl w-full border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Filtruoti pagal vairuotoją..."
        >
        <datalist id="filterUserList"></datalist>
      </div>

      <select
        id="filterInstr"
        class="p-3 bg-slate-800 rounded-xl border border-slate-700"
      >
        <option value="all" data-i18n="common.all_instructions">Visos instrukcijos</option>
      </select>

    </div>
  </div>

  <div class="bg-slate-900 rounded-xl border border-slate-700 overflow-hidden">
    <div class="w-full overflow-x-auto">
      <table class="w-full min-w-[760px] text-sm">
        <thead class="bg-slate-800">
          <tr class="text-left">
            <th class="p-3" data-i18n="tasks.task">Užduotis</th>
            <th class="p-3" data-i18n="tasks.status">Statusas</th>
            <th class="p-3 assigned-col" data-i18n="tasks.assigned_to">Kam skirta</th>
            <th class="p-3" data-i18n="tasks.instruction">Instrukcija</th>
            <th class="p-3 text-right" data-i18n="tasks.actions">Veiksmai</th>
          </tr>
        </thead>

        <tbody id="taskTable"></tbody>
      </table>
    </div>
  </div>

  <div
    id="imgModal"
    class="fixed inset-0 bg-black/80 hidden z-50"
  >
    <div class="w-full h-full flex items-center justify-center p-4">
      <img
        id="modalImg"
        class="max-w-[95%] max-h-[90%] rounded shadow-xl"
        alt="Peržiūra"
      >
    </div>
  </div>

  <div
    id="instructionModal"
    class="fixed inset-0 bg-black/80 hidden z-[60]"
  >
    <div class="w-full h-full flex items-center justify-center p-3 sm:p-6">
      <div class="w-full max-w-6xl max-h-[92vh] bg-slate-900 rounded-xl border border-slate-700 overflow-hidden flex flex-col">

        <div class="flex items-center justify-between gap-3 p-4 border-b border-slate-700">
          <h2
            id="instructionModalTitle"
            class="text-lg sm:text-xl font-semibold"
          ></h2>

          <button
            id="closeInstructionModal"
            type="button"
            class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl shrink-0"
          >
            ✕
          </button>
        </div>

        <div
          id="instructionModalBody"
          class="p-4 sm:p-6 overflow-auto flex-1"
        ></div>

        <div
          id="instructionModalFooter"
          class="p-4 border-t border-slate-700 flex gap-3 justify-end flex-wrap"
        ></div>

      </div>
    </div>
  </div>

</div>
