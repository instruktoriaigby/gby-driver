<div class="min-h-screen flex items-center justify-center px-4 py-8">

  <div class="w-full max-w-md bg-slate-900 border border-slate-700 rounded-2xl p-6 shadow-xl">

    <div class="flex justify-center mb-6">
      <img
        src="assets/icons/icon-512.png"
        alt="GBY"
        class="h-40 object-contain"
      >
    </div>

    <h1
      class="text-2xl font-semibold mb-2 text-center"
      data-i18n="login.title"
    >
      Prisijungimas
    </h1>

    <p
      class="text-slate-400 mb-6 text-center text-sm sm:text-base"
      data-i18n="login.subtitle"
    >
      Prisijunkite prie sistemos
    </p>

    <form id="loginForm" class="space-y-4">

      <div>
        <label
          for="loginEmail"
          class="block text-sm text-slate-400 mb-1"
          data-i18n="login.email"
        >
          El. paštas
        </label>

        <input
          id="loginEmail"
          type="email"
          inputmode="email"
          class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          data-i18n-placeholder="login.email"
          placeholder="El. paštas"
          autocomplete="email"
          required
        >
      </div>

      <div>
        <label
          for="loginPassword"
          class="block text-sm text-slate-400 mb-1"
          data-i18n="login.password"
        >
          Slaptažodis
        </label>

        <input
          id="loginPassword"
          type="password"
          class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
          data-i18n-placeholder="login.password"
          placeholder="Slaptažodis"
          autocomplete="current-password"
          required
        >
      </div>

      <button
        id="loginSubmitBtn"
        type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 p-3 rounded-xl font-semibold disabled:opacity-60 disabled:cursor-not-allowed"
        data-i18n="login.submit"
      >
        Prisijungti
      </button>

    </form>

    <div
      id="loginError"
      class="text-red-400 text-sm mt-4 hidden"
    ></div>

  </div>

</div>
