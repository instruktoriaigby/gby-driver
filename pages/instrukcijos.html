<div class="w-full max-w-7xl mx-auto px-4 sm:px-6">

  <h1
    class="text-xl sm:text-2xl font-semibold mb-2"
    data-i18n="instr.title"
  >
    Instrukcijos vairuotojams
  </h1>

  <p
    class="text-slate-400 mb-6 text-sm sm:text-base"
    data-i18n="instr.subtitle"
  >
    Visa svarbi informacija vienoje vietoje
  </p>

  <div class="mb-4">
    <input
      id="instructionSearch"
      type="search"
      list="instructionSearchList"
      autocomplete="off"
      class="w-full p-3 bg-slate-800 rounded-xl border border-slate-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
      data-i18n-placeholder="tasks.search_placeholder"
      placeholder="Ieškoti užduoties..."
    >
    <datalist id="instructionSearchList"></datalist>
  </div>

  <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mb-6">
    <button
      type="button"
      class="tab-btn w-full py-3 px-2 rounded-xl text-sm sm:text-base transition border border-slate-600 bg-blue-600 text-white shadow-md shadow-blue-500/30"
      data-tab="general"
      data-i18n="tabs.general"
    >
      Bendri
    </button>

    <button
      type="button"
      class="tab-btn w-full py-3 px-2 rounded-xl text-sm sm:text-base transition border border-slate-600 bg-slate-800 hover:bg-slate-700"
      data-tab="news"
      data-i18n="tabs.news"
    >
      Naujovės
    </button>

    <button
      type="button"
      class="tab-btn w-full py-3 px-2 rounded-xl text-sm sm:text-base transition border border-slate-600 bg-slate-800 hover:bg-slate-700"
      data-tab="event"
      data-i18n="tabs.events"
    >
      Eismo įvykiai
    </button>

    <button
      type="button"
      class="tab-btn w-full py-3 px-2 rounded-xl text-sm sm:text-base transition border border-slate-600 bg-slate-800 hover:bg-slate-700"
      data-tab="cargo"
      data-i18n="tabs.cargo"
    >
      Krovinys
    </button>

    <button
      type="button"
      class="tab-btn w-full py-3 px-2 rounded-xl text-sm sm:text-base transition border border-slate-600 bg-slate-800 hover:bg-slate-700 col-span-2 sm:col-span-1"
      data-tab="eco"
      data-i18n="tabs.eco"
    >
      Eko vairavimas
    </button>
  </div>

  <div
    id="topicsContainer"
    class="flex flex-col gap-4"
  ></div>

</div>
